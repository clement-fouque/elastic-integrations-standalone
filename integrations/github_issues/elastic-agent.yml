outputs:
  default:
    type: elasticsearch
    hosts:
      - ${ELASTIC_HOST}
    username: ${ELASTIC_USERNAME}
    password: ${ELASTIC_PASSWORD}
    ssl.verification_mode: none
    preset: throughput

agent:
  download:
    sourceURI: "https://artifacts.elastic.co/downloads/"
  monitoring:
    enabled: false
    use_output: default
    namespace: default
    logs: false
    metrics: false
  features: {}

inputs:
  - id: httpjson-github-issues
    name: github-issues
    revision: 2
    type: httpjson
    use_output: default
    meta:
      package:
        name: github
        version: ${env.ELASTIC_INTEGRATION_GITHUB_VERSION}
    data_stream:
      namespace: default
    streams:
      - id: httpjson-github.issues
        data_stream:
          dataset: github.issues
          type: logs
        config_version: "2"
        interval: 10m
        request.tracer:
          enabled: false
          filename: "../../logs/httpjson/http-request-trace-*.ndjson"
          maxbackups: 5
        request.method: GET
        request.url: https://api.github.com/repos/${env.GITHUB_OWNER}/${env.GITHUB_REPOSITORY}/issues
        request.timeout: 60s
        request.transforms:
          - set:
              target: header.Authorization
              value: "Bearer ${env.GITHUB_TOKEN}"
          - set:
              target: url.params.state
              value: all
              do_not_log_failure: true
          - set:
              target: url.params.filter
              value: all
              do_not_log_failure: true
          - set:
              target: url.params.labels
              value: ""
              do_not_log_failure: true
          - set:
              target: url.params.since
              value: ""
              do_not_log_failure: true
          - set:
              target: url.params.per_page
              value: 100
        request.rate_limit.limit: '[[ .last_response.header.Get "X-RateLimit-Limit" ]]'
        request.rate_limit.reset: '[[ .last_response.header.Get "X-RateLimit-Reset" ]]'
        request.rate_limit.remaining: '[[ .last_response.header.Get "X-RateLimit-Remaining" ]]'
        response.pagination:
          - set:
              target: url.value
              value: '[[ if index .last_response.header "Link" ]][[ getRFC5988Link "next" .last_response.header.Link ]][[ end ]]'
              fail_on_template_error: true
              do_not_log_failure: true
        tags:
          - forwarded
          - github-issues
        publisher_pipeline.disable_host: true

agent.logging.to_stderr: true
