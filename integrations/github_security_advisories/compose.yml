name: elastic-github-security-advisories

services:
  github_security_advisories:
    image: docker.elastic.co/elastic-agent/elastic-agent-wolfi:${ELASTIC_VERSION:?Set ELASTIC_VERSION to the stack version}
    restart: unless-stopped
    environment:
      FLEET_ENROLL: "0"
      ELASTIC_HOST: ${ELASTIC_HOST:?Set the container-side Elasticsearch URL}
      ELASTIC_USERNAME: ${ELASTICSEARCH_USERNAME:?Set ELASTICSEARCH_USERNAME}
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?Set ELASTICSEARCH_PASSWORD}
      # Keep this version aligned with terraform.tfvars.
      ELASTIC_INTEGRATION_GITHUB_VERSION: "3.0.0"
      GITHUB_SECURITY_ADVISORIES_API_KEY: ${GITHUB_SECURITY_ADVISORIES_API_KEY-}
    network_mode: host
    volumes:
      - type: bind
        source: ./integrations/github_security_advisories/elastic-agent.yml
        target: /usr/share/elastic-agent/elastic-agent.yml
        read_only: true
        bind:
          create_host_path: false
