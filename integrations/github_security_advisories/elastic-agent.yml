outputs:
  default:
    type: elasticsearch
    hosts:
      - ${ELASTIC_HOST}
    username: ${ELASTIC_USERNAME}
    password: ${ELASTIC_PASSWORD}
    ssl.verification_mode: none
    preset: throughput

agent:
  download:
    sourceURI: "https://artifacts.elastic.co/downloads/"
  monitoring:
    enabled: false
    use_output: default
    namespace: default
    logs: false
    metrics: false
  features: {}

inputs:
  - id: cel-github-security-advisories
    name: github-security-advisories
    revision: 1
    type: cel
    use_output: default
    meta:
      package:
        name: github
        version: ${env.ELASTIC_INTEGRATION_GITHUB_VERSION}
    data_stream:
      namespace: default
    streams:
      - id: cel-github.security_advisories-reviewed
        data_stream:
          dataset: github.security_advisories
          type: logs
        config_version: 2
        interval: 24h
        resource.tracer:
          enabled: false
          filename: "../../logs/cel/http-request-trace-*.ndjson"
          maxbackups: 5
        resource.url: https://api.github.com/advisories
        state:
          api_key: "${env.GITHUB_SECURITY_ADVISORIES_API_KEY|''}"
          advisory_type: reviewed
          batch_size: 100
        redact:
          fields:
            - api_key
        regexp:
          github_link_next: '<([^>]+)>; rel="next"'
        max_executions: 5000
        program: &github-security-advisories-program |-
          request(
            "GET",
            state.?cursor.next_url.orValue(state.url.trim_right("/") + "?" + {
                "per_page": [string(state.batch_size)],
                "type": [state.advisory_type],
                "sort": ["published"],
                "order": ["desc"]
              }.format_query()
            )
          ).with({
            "Header": {
                "Accept": ["application/vnd.github+json"],
                "X-GitHub-Api-Version": ["2022-11-28"],
                ?"Authorization": has(state.api_key) && state.api_key != "" ? optional.ofNonZeroValue(["Bearer " + state.api_key]) : optional.ofNonZeroValue([]),
            },
          }).do_request().as(resp, (resp.StatusCode != 200) ?
            {
              ?"api_key": state.?api_key,
              "advisory_type": state.advisory_type,
              "batch_size": state.batch_size,
              "events": {
                "error": {
                  "code": string(resp.StatusCode),
                  "id": string(resp.Status),
                  "message": "GET " + state.url.trim_right("/") + ": " + (
                    (size(resp.Body) != 0) ?
                      string(resp.Body)
                    :
                      string(resp.Status) + " (" + string(resp.StatusCode) + ")"
                  ),
                },
              },
              "url": state.url,
              "want_more": false,
            }
          :
            bytes(resp.Body).decode_json().as(body,
              {
                ?"api_key": state.?api_key,
                "advisory_type": state.advisory_type,
                "batch_size": state.batch_size,
                "cursor": {
                   ?"next_url": (
                    (has(resp.?Header.Link) && size(resp.Header.Link) != 0 && resp.Header.Link[0].re_match("github_link_next")) ?
                      resp.Header.Link[0].re_find_submatch("github_link_next")[?1]
                    :
                      optional.none()
                  ),
                },
                "events": body.map(e,
                  {
                    "message": e.encode_json(),
                  }
                ),
                "url": state.url,
                "want_more": has(resp.?Header.Link) && size(resp.Header.Link) != 0 && resp.Header.Link[0].re_match("github_link_next"),
              }
            )
          )
        tags:
          - forwarded
          - github-security-advisories
          - github-security-advisories-reviewed
        publisher_pipeline.disable_host: true
      - id: cel-github.security_advisories-unreviewed
        data_stream:
          dataset: github.security_advisories
          type: logs
        config_version: 2
        interval: 24h
        resource.tracer:
          enabled: false
          filename: "../../logs/cel/http-request-trace-*.ndjson"
          maxbackups: 5
        resource.url: https://api.github.com/advisories
        state:
          api_key: "${env.GITHUB_SECURITY_ADVISORIES_API_KEY|''}"
          advisory_type: unreviewed
          batch_size: 100
        redact:
          fields:
            - api_key
        regexp:
          github_link_next: '<([^>]+)>; rel="next"'
        max_executions: 5000
        program: *github-security-advisories-program
        tags:
          - forwarded
          - github-security-advisories
          - github-security-advisories-unreviewed
        publisher_pipeline.disable_host: true
      - id: cel-github.security_advisories-malware
        data_stream:
          dataset: github.security_advisories
          type: logs
        config_version: 2
        interval: 24h
        resource.tracer:
          enabled: false
          filename: "../../logs/cel/http-request-trace-*.ndjson"
          maxbackups: 5
        resource.url: https://api.github.com/advisories
        state:
          api_key: "${env.GITHUB_SECURITY_ADVISORIES_API_KEY|''}"
          advisory_type: malware
          batch_size: 100
        redact:
          fields:
            - api_key
        regexp:
          github_link_next: '<([^>]+)>; rel="next"'
        max_executions: 5000
        program: *github-security-advisories-program
        tags:
          - forwarded
          - github-security-advisories
          - github-security-advisories-malware
        publisher_pipeline.disable_host: true

agent.logging.to_stderr: true
