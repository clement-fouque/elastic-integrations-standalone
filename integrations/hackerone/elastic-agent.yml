# https://www.elastic.co/docs/reference/fleet/elastic-agent-reference-yaml

outputs:
  default:
    type: elasticsearch
    hosts:
      - ${ELASTIC_HOST}
    # api_key: "example-key"
    username: ${ELASTIC_USERNAME}
    password: ${ELASTIC_PASSWORD}
    ssl.verification_mode: none

    # Performance preset for elasticsearch outputs. One of "balanced", "throughput",
    # "scale", "latency" and "custom".
    # Since the container is dedicated solely to running the agent, we don't need to reserve resources for other applications.
    preset: throughput

agent:
  download:
    sourceURI: "https://artifacts.elastic.co/downloads/"
  monitoring:
    enabled: false
    use_output: default
    namespace: default
    logs: false
    metrics: false
  features: {}

providers:
  local:
    vars:
      hackerone_api_token_identifier: "${HACKERONE_API_TOKEN_IDENTIFIER}"
      hackerone_api_token_value: "${HACKERONE_API_TOKEN_VALUE}"
      hackerone_program_handle_1: "${HACKERONE_PROGRAM_HANDLE_1}"
      elastic_integration_hackerone_version: "${ELASTIC_INTEGRATION_HACKERONE_VERSION}"

inputs:
  - id: cel-hackerone-da588b07-8ffc-48f2-a15c-cd25e1dc8a8a
    name: hackerone-1
    revision: 1
    type: cel
    use_output: default
    meta:
      package:
        name: hackerone
        version: ${local.elastic_integration_hackerone_version}
    data_stream:
      namespace: default
    package_policy_id: da588b07-8ffc-48f2-a15c-cd25e1dc8a8a
    streams:
      - id: cel-hackerone.report-da588b07-8ffc-48f2-a15c-cd25e1dc8a8a
        data_stream:
          dataset: hackerone.report
          type: logs
        interval: 5m
        resource.tracer:
          enabled: false
          filename: ../../logs/cel/http-request-trace-*.ndjson
          maxbackups: 5
        resource.timeout: 60s
        resource.url: https://api.hackerone.com
        resource.rate_limit.limit: 5
        resource.rate_limit.burst: 20
        resource.headers:
          Accept: application/json
        state:
          initial_interval: 87600h
          page_size: 100
          program_handles:
            - ${local.hackerone_program_handle_1}
          api_token_identifier: ${local.hackerone_api_token_identifier}
          api_token_value: ${local.hackerone_api_token_value}
        redact:
          fields:
            - api_token_identifier
            - api_token_value
        program: |-
          {
            "updated_since": (state.?cursor.cycle_since.orValue("") != "") ?
              state.?cursor.cycle_since.orValue("")
            :
              state.?cursor.max_updated_at.orValue(
                string(now - duration(state.initial_interval))
              ),
            "prior_running": string(state.?cursor.running_max_updated_at.orValue("")),
          }.as(bind,
            state.with(
              request(
                "GET",
                (state.?next_link.orValue("") != "") ?
                  state.?next_link.orValue("")
                :
                  state.url.trim_right("/") + "/v1/reports?" + {
                    "sort": ["reports.last_activity_at"],
                    "page[size]": [string(int(state.page_size))],
                    "filter[last_activity_at__gt]": [
                      (
                        state.?cursor.max_updated_at.optMap(t,
                          timestamp(t) + duration("1ms")
                        )
                      ).orValue(
                        now - duration(state.initial_interval)
                      ).format("2006-01-02T15:04:05.000Z07:00"),
                    ],
                    ?"filter[program][]": state.?program_handles[0].hasValue() ?
                      optional.of(state.program_handles)
                    :
                      optional.none(),
                    ?"filter[inbox_ids][]": state.?inbox_ids[0].hasValue() ?
                      optional.of(state.inbox_ids)
                    :
                      optional.none(),
                    ?"filter[state][]": state.?state_filter[0].hasValue() ?
                      optional.of(state.state_filter)
                    :
                      optional.none(),
                    ?"filter[severity][]": state.?severity_filter[0].hasValue() ?
                      optional.of(state.severity_filter)
                    :
                      optional.none(),
                  }.format_query()
              ).with(
                {
                  "Header": {
                    "Accept": ["application/json"],
                    "Authorization": [
                      "Basic " + bytes(state.api_token_identifier + ":" + state.api_token_value).base64(),
                    ],
                  },
                }
              ).do_request().as(resp,
                (resp.StatusCode == 200) ?
                  try(resp.Body.decode_json()).as(body,
                    is_error(body.with({})) ?
                      {
                        "events": {
                          "error": {
                            "message": "GET /v1/reports: Response is not a JSON object",
                          },
                        },
                        "want_more": false,
                        "next_link": "",
                        "url": state.url,
                      }
                    :
                      {
                        "items": body.?data.orValue([]),
                        "next_link": (body.?links.next.orValue(null) != null) ?
                          string(body.links.next).as(raw,
                            raw.startsWith("/") ?
                              (state.url.trim_right("/") + raw)
                            :
                              raw
                          )
                        :
                          "",
                        "max_updated": body.?data.orValue([]).map(r,
                          r.?attributes.last_activity_at.hasValue() || r.?attributes.created_at.hasValue(),
                          r.?attributes.last_activity_at.orValue(r.?attributes.created_at.orValue(""))
                        ).as(stamps,
                          (size(stamps) > 0) ? stamps.max() : ""
                        ),
                      }.as(page,
                        (
                          (bind.prior_running != "" && page.max_updated != "") ?
                            (
                              (bind.prior_running > page.max_updated) ?
                                bind.prior_running
                              :
                                page.max_updated
                            )
                          : (bind.prior_running != "") ? bind.prior_running : page.max_updated
                        ).as(cm,
                          {
                            "events": (size(page.items) > 0) ?
                              dyn(page.items.map(e, {"message": e.encode_json()}))
                            : (page.next_link != "") ?
                              dyn([{"retry": true}])
                            :
                              dyn([]),
                            "want_more": page.next_link != "",
                            "next_link": page.next_link,
                            "cursor": (page.next_link != "") ?
                              {
                                ?"max_updated_at": state.?cursor.max_updated_at,
                                "cycle_since": bind.updated_since,
                                "running_max_updated_at": cm,
                              }
                            :
                              {
                                ?"max_updated_at": (cm != "") ?
                                  optional.of(cm)
                                :
                                  state.?cursor.max_updated_at,
                              },
                            "url": state.url,
                          }
                        )
                      )
                  )
                :
                  {
                    "events": {
                      "error": {
                        "message": "GET /v1/reports: " + string(resp.StatusCode),
                      },
                    },
                    "want_more": false,
                    "next_link": "",
                    "url": state.url,
                  }
              )
            )
          )
        tags:
          - forwarded
          - hackerone-report
        publisher_pipeline.disable_host: true
        processors:
          - drop_event.when.equals.retry: true

# Send all logging output to stderr. The default is false.
agent.logging.to_stderr: true
