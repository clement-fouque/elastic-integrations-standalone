outputs:
  default:
    type: elasticsearch
    hosts:
      - ${ELASTIC_HOST}
    username: ${ELASTIC_USERNAME}
    password: ${ELASTIC_PASSWORD}
    ssl.verification_mode: none
    preset: throughput

agent:
  download:
    sourceURI: "https://artifacts.elastic.co/downloads/"
  monitoring:
    enabled: false
    use_output: default
    namespace: default
    logs: false
    metrics: false
  features: {}

inputs:
  - id: cel-first-epss
    name: first-epss
    revision: 1
    type: cel
    use_output: default
    meta:
      package:
        name: first_epss
        version: ${env.ELASTIC_INTEGRATION_FIRST_EPSS_VERSION}
    data_stream:
      namespace: default
    streams:
      - id: cel-first_epss.vulnerability
        data_stream:
          dataset: first_epss.vulnerability
          type: logs
        config_version: 2
        interval: 24h
        resource.tracer:
          enabled: false
          filename: "../../logs/cel/http-request-trace-*.ndjson"
          maxbackups: 5
          maxsize: 5
        resource.timeout: 10m
        resource.url: https://api.first.org/data/v1/epss
        state:
          batch_size: 100
        max_executions: 5000
        # Matches the first_epss package cel.yml.hbs and its defaults. Each run
        # pages through the full latest snapshot from offset 0.
        program: |-
          state.with(
                request(
                        "GET",
                        state.url + "?" + {
                                "limit": [string(state.batch_size)],
                                "offset": [
                                        (has(state.cursor) && has(state.cursor.nextOffset) && state.cursor.nextOffset != null) ?
                                                string(state.cursor.nextOffset)
                                        :
                                                "0",
                                ],
                        }.format_query()
                ).do_request().as(resp, (resp.StatusCode != 200) ?
                        {
                                "events": {
                                        "error": {
                                                "code": string(resp.StatusCode),
                                                "id": string(resp.Status),
                                                "message": "GET:" + 
                                                (
                                                        (size(resp.Body) != 0) ?
                                                                string(resp.Body)
                                                        :
                                                                string(resp.Status) + " (" + string(resp.StatusCode) + ")"
                                                ),
                                        },
                                },
                                "want_more": false,
                        }
                :
                        bytes(resp.Body).decode_json().as(body, !has(body.data) ?
                                {
                                        "events": [],
                                        "want_more": false,
                                }
                        :
                                {
                                        "events": body.data.map(vulnerability,
                                                {
                                                        "message": vulnerability.encode_json(),
                                                }
                                        ),
                                        "cursor": {
                                                "nextOffset": (body.offset + body.limit < body.total) ?
                                                        (body.offset + body.limit)
                                                :
                                                        null,
                                        },
                                        "want_more": body.offset + body.limit < body.total,
                                }
                        )
                )
          )
        tags:
          - forwarded
          - first-epss
        publisher_pipeline.disable_host: true

agent.logging.to_stderr: true
