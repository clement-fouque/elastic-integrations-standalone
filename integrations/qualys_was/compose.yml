name: elastic-qualys-was

services:
  qualys_was:
    image: docker.elastic.co/elastic-agent/elastic-agent-wolfi:${ELASTIC_VERSION:?Set ELASTIC_VERSION to the stack version}
    restart: unless-stopped
    environment:
      FLEET_ENROLL: "0"
      ELASTIC_HOST: ${ELASTIC_HOST:?Set the container-side Elasticsearch URL}
      ELASTIC_USERNAME: ${ELASTICSEARCH_USERNAME:?Set ELASTICSEARCH_USERNAME}
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?Set ELASTICSEARCH_PASSWORD}
      # Keep this version aligned with terraform.tfvars.
      ELASTIC_INTEGRATION_QUALYS_WAS_VERSION: "0.7.1"
      QUALYS_WAS_API_URL: ${QUALYS_WAS_API_URL:?Set QUALYS_WAS_API_URL}
      QUALYS_WAS_USERNAME: ${QUALYS_WAS_USERNAME:?Set QUALYS_WAS_USERNAME}
      QUALYS_WAS_PASSWORD: ${QUALYS_WAS_PASSWORD:?Set QUALYS_WAS_PASSWORD}
    network_mode: host
    volumes:
      - type: bind
        source: ./integrations/qualys_was/elastic-agent.yml
        target: /usr/share/elastic-agent/elastic-agent.yml
        read_only: true
        bind:
          create_host_path: false
